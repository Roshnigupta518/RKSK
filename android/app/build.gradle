apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * F-15 hardening: Enable R8 (successor of ProGuard) on release builds.
 *
 * With this flag ON, AGP runs R8 across the compiled Java/Kotlin classes to:
 *   1. Shrink   — dead-code elimination (removes classes/methods JS never calls)
 *   2. Optimise — inlines short methods, replaces enums with ints, etc.
 *   3. Obfuscate — renames every non-kept class/method/field to a→b→c…
 *
 * The obfuscation half is the F-15 fix on the native side: without it, a
 * `classes.dex` extraction from the APK reveals `com.rksk.SecureToken`,
 * `JailMonkeyModule.isJailBroken`, and every autolinked NativeModule's
 * `@ReactMethod` name in plain text. R8 renames all of them to opaque
 * two-letter symbols while keeping the ones ProGuard rules whitelist.
 *
 * Which rules keep the app from crashing under R8 lives in
 * `proguard-rules.pro` (this project) plus:
 *   - `node_modules/react-native/ReactAndroid/proguard-rules.pro`
 *     (auto-included via the AGP consumer-rules mechanism when the app
 *      depends on `com.facebook.react:react-android`)
 *   - `node_modules/react-native-reanimated/android/proguard-rules.pro`
 *   - `node_modules/react-native-worklets/android/proguard-rules.pro`
 *     (both consumed the same way through their AAR metadata)
 *
 * If a release build crashes with `ClassNotFoundException` after this flag
 * was flipped on, see android/OBFUSCATION.md §5 for the diagnostic recipe
 * (grep the R8 mapping.txt, add a targeted -keep, re-run). Do NOT solve it
 * by flipping this flag back to false without escalating.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rkskmp"
    defaultConfig {
        applicationId "com.rkskmp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.0.13"

        // F-08: inject Google Maps API key at build time so it never lives
        // in source control. Developers set GOOGLE_MAPS_API_KEY in
        // ~/.gradle/gradle.properties; CI supplies ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY.
        // If neither is present, we substitute a syntactically valid but
        // deliberately non-functional placeholder so debug builds still
        // assemble cleanly on a fresh checkout (Maps tiles simply won't
        // render until the real key is supplied). See android/SECRETS.md.
        def googleMapsApiKey = project.findProperty('GOOGLE_MAPS_API_KEY') ?: 'MISSING_GOOGLE_MAPS_API_KEY'
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]
    }
    // -------------------------------------------------------------------------
    // ABI splitting policy
    //
    // Two distribution formats need different treatment:
    //
    //   1. `./gradlew assembleRelease`  → per-ABI APKs
    //      splits.abi.enable=true builds one APK per listed ABI. This is
    //      the right path for sideloading, internal distribution, or
    //      testing on a specific device.
    //
    //   2. `./gradlew bundleRelease`    → Android App Bundle (.aab)
    //      An AAB is intrinsically multi-ABI: Play Console reads its
    //      per-ABI targeting metadata and delivers a device-specific
    //      APK (containing only that device's ABI slice) at install
    //      time via Dynamic Delivery. `splits.abi` on top of an AAB
    //      is redundant, and since AGP 8.6 is an explicit build error:
    //         "Multiple shrunk-resources files found ...
    //          Please disable building multiple APKs when building an
    //          Android app bundle."
    //         https://issuetracker.google.com/402800800
    //
    // So we detect the invocation mode at configuration time and toggle
    // `splits.abi.enable` accordingly. `gradle.startParameter.taskNames`
    // is populated before the `android { }` block is evaluated, so this
    // check is safe here (unlike `gradle.taskGraph.whenReady`, which
    // resolves too late for splits configuration to react).
    // -------------------------------------------------------------------------
    def isBundleBuild = gradle.startParameter.taskNames.any { taskName ->
        def lower = taskName.toLowerCase()
        // Matches: `bundle`, `bundleRelease`, `bundleDebug`,
        // `:app:bundleRelease`, `app:bundleRelease`, or any custom
        // variant flavour like `bundleProdRelease`.
        lower == 'bundle' ||
                lower.startsWith('bundle') ||
                lower.endsWith(':bundle') ||
                (lower.contains(':bundle') && !lower.contains('assemble'))
    }

    splits {
        abi {
            // ABI splits are only meaningful for APK output. Disabling for
            // AAB builds prevents the AGP-side "multiple shrunk-resources
            // files" error while still keeping the desired per-ABI slicing
            // (Play Console does the equivalent at install time from the
            // AAB's targeting metadata).
            enable !isBundleBuild
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false // don't include all ABIs in one fat APK
        }
    }

    // Independent of the split policy above: strip x86 / x86_64 native libs
    // from the final artifact. RKSK ships to arm-only physical devices in
    // the field; the intel slices only exist for emulator debug builds.
    // AGP includes them by default when a `.so` is present for those ABIs
    // in any depended-on AAR (react-android bundles x86 for emulator dev).
    // We keep them out of the release artifact to shrink download size.
    //
    // For AAB builds, this exclusion also applies — Play Console will still
    // deliver arm-only APKs to arm devices, but the AAB itself is smaller
    // to upload if x86 slices are omitted upstream.
    packagingOptions {
        jniLibs {
            excludes += ["lib/x86/**", "lib/x86_64/**"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release keystore properties are loaded from ~/.gradle/gradle.properties
            // (per-user, outside VCS) or from ORG_GRADLE_PROJECT_* env vars on CI.
            // See android/SIGNING.md for setup instructions.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }

            // F-07 hardening: explicitly enable modern APK Signature Schemes and
            // DISABLE v1 (JAR signing). v1 is vulnerable to the Janus attack
            // (CVE-2017-13156) which lets an attacker prepend a malicious DEX
            // to a signed APK without invalidating the v1 signature. Because
            // this project's minSdkVersion is 24 (Android 7.0) and every
            // supported device enforces v2+ verification, v1 provides zero
            // additional coverage and only widens the attack surface.
            //
            //   v2 (whole-file) → API 24+ (Android 7.0)
            //   v3 (key rotation support) → API 28+ (Android 9)
            //   v4 (incremental install, produces .apk.idsig sidecar) → API 30+
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Conditionally attach the release signingConfig. When the upload
            // keystore properties aren't present (e.g. a dev machine that only
            // builds debug, or `./gradlew clean`), we simply don't wire signing
            // in — the release APK would end up unsigned. That silent path is
            // then turned into a loud failure by the gradle.taskGraph.whenReady
            // guard below, but only when a release-signing task is actually
            // scheduled to execute. This keeps clean/debug/sync flows working.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // F-15: enable R8 minification + obfuscation on release. Debug
            // builds intentionally skip R8 so on-device debugging and Metro
            // fast-refresh work without a 30-second R8 pass on every rebuild.
            minifyEnabled enableProguardInReleaseBuilds

            // F-15: also shrink resources (drawables, layouts, strings that
            // R8 proved are unreferenced). Cheap APK size win + drops any
            // dev-only asset that leaked into `res/`. `shrinkResources` is
            // only legal when `minifyEnabled` is true; the flag above must
            // stay in sync.
            shrinkResources enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// -----------------------------------------------------------------------------
// F-15 hardening: guarantee the Hermes / Metro source map never ships in the
// packaged APK.
//
// The RN gradle plugin generates a Hermes source map at
//   android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
// which is designed to be UPLOADED to a crash-reporting service (Sentry,
// Firebase Crashlytics, Datadog, …) for on-server symbolication, and then
// discarded. If it ever gets packaged into `assets/` inside the APK, an
// attacker can trivially recover original-source-quality JavaScript from
// the shipped Hermes bytecode.
//
// The current RN 0.81 gradle plugin does not bundle the .map file by
// default, but future dependency bumps or a mis-configured `bundleConfig`
// can silently regress that. This block fails the release build fast if
// any `.map` file has snuck into the packaged assets after the merge step.
//
// Implementation note: we use `tasks.matching { ... }.configureEach { ... }`
// (a lazy, AGP-version-agnostic task-hook pattern — identical to the one
// used in the root android/build.gradle for the prefab-race workaround)
// rather than `variant.mergeAssetsProvider.configure` (which changed
// signature between AGP 7 and 8).
// -----------------------------------------------------------------------------
tasks.matching { it.name == "mergeReleaseAssets" }.configureEach { mergeTask ->
    mergeTask.doLast {
        // AGP has moved this property around; try both.
        def assetsDir = null
        try {
            assetsDir = mergeTask.outputDir.get().asFile
        } catch (Exception e1) {
            try {
                assetsDir = mergeTask.outputDir.asFile
            } catch (Exception ignored) {
                // Nothing to check; treat as pass.
                return
            }
        }
        if (assetsDir == null || !assetsDir.exists()) return

        def leakedMaps = fileTree(assetsDir) {
            include "**/*.map"
            include "**/*.hbcmap"
            include "**/*.bundle.map"
        }.files
        if (!leakedMaps.isEmpty()) {
            def names = leakedMaps.collect { it.name }.join(', ')
            throw new GradleException(
                "F-15: source map(s) [${names}] leaked into packaged " +
                "assets at ${assetsDir}. Release APKs must NOT ship " +
                "source maps — they defeat Hermes bytecode obfuscation " +
                "by mapping HBC back to readable source. Upload the " +
                ".map to your crash-reporting service instead. See " +
                "android/OBFUSCATION.md §4."
            )
        }
    }
}

// -----------------------------------------------------------------------------
// F-07 hardening: reject release builds if the upload keystore isn't configured.
//
// This runs at execution time (after the task graph is resolved) rather than at
// configuration time, so it does NOT interfere with:
//     ./gradlew clean         ./gradlew tasks
//     ./gradlew assembleDebug ./gradlew installDebug
//     Android Studio Gradle sync / IDE project imports
//
// It ONLY fails the build when Gradle is about to run a release-signing task
// (assembleRelease, bundleRelease, packageRelease, signRelease, installRelease,
// or the validateSigningRelease preflight) without the required credentials.
// -----------------------------------------------------------------------------
gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskPrefixes = [
        'assemble', 'bundle', 'package', 'install', 'sign', 'validateSigning',
    ]
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        def n = task.name
        return n.endsWith('Release') && releaseTaskPrefixes.any { p -> n.startsWith(p) }
    }
    if (!isReleaseBuild) {
        return
    }

    // F-07: release must have a real upload keystore configured.
    if (!project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
        throw new GradleException(
            'Release keystore not configured. Set MYAPP_UPLOAD_STORE_FILE, ' +
            'MYAPP_UPLOAD_KEY_ALIAS, MYAPP_UPLOAD_STORE_PASSWORD and ' +
            'MYAPP_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties ' +
            '(or as ORG_GRADLE_PROJECT_* environment variables on CI). ' +
            'See android/SIGNING.md for setup instructions.'
        )
    }

    // F-08: release must have a real Google Maps API key. The debug-time
    // fallback in defaultConfig is deliberately non-functional so that
    // shipping it would result in a broken map — better to fail the build.
    if (!project.hasProperty('GOOGLE_MAPS_API_KEY')) {
        throw new GradleException(
            'Google Maps API key not configured for a release build. Set ' +
            'GOOGLE_MAPS_API_KEY in ~/.gradle/gradle.properties (or as ' +
            'ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY on CI). See ' +
            'android/SECRETS.md for how to create a properly restricted ' +
            'Android key in the Google Cloud Console.'
        )
    }
}

// -----------------------------------------------------------------------------
// F-18 hardening — belt-and-braces exclusion of LAME 3.100 + JLayer 1.0.1.
//
// react-native-compressor 1.13.0 pulls in two problematic transitive deps
// (`com.github.banketree:AndroidLame-kotlin:v0.0.1`, which wraps LAME 3.100,
// and `javazoom:jlayer:1.0.1`, a 2008-vintage MP3 decoder). RKSK never
// invokes audio compression, so both are dead weight AND known-CVE attack
// surface.
//
// The primary defense is `patches/react-native-compressor+1.13.0.patch`,
// which rewrites the compressor's own `build.gradle` and Kotlin sources to
// drop the deps. This block is a defense-in-depth backup: even if
// patch-package is skipped, the patch fails to apply cleanly after a
// `react-native-compressor` bump, or someone hand-edits the compressor
// build.gradle, Gradle will still refuse to resolve these coordinates
// project-wide. See android/AUDIO_STRIP.md.
// -----------------------------------------------------------------------------
configurations.all {
    exclude group: 'com.github.banketree', module: 'AndroidLame-kotlin'
    exclude group: 'javazoom',             module: 'jlayer'
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

