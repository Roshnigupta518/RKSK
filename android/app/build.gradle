apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * F-15 hardening: Enable R8 (successor of ProGuard) on release builds.
 *
 * With this flag ON, AGP runs R8 across the compiled Java/Kotlin classes to:
 *   1. Shrink   — dead-code elimination (removes classes/methods JS never calls)
 *   2. Optimise — inlines short methods, replaces enums with ints, etc.
 *   3. Obfuscate — renames every non-kept class/method/field to a→b→c…
 *
 * The obfuscation half is the F-15 fix on the native side: without it, a
 * `classes.dex` extraction from the APK reveals `com.rksk.SecureToken`,
 * `JailMonkeyModule.isJailBroken`, and every autolinked NativeModule's
 * `@ReactMethod` name in plain text. R8 renames all of them to opaque
 * two-letter symbols while keeping the ones ProGuard rules whitelist.
 *
 * Which rules keep the app from crashing under R8 lives in
 * `proguard-rules.pro` (this project) plus:
 *   - `node_modules/react-native/ReactAndroid/proguard-rules.pro`
 *     (auto-included via the AGP consumer-rules mechanism when the app
 *      depends on `com.facebook.react:react-android`)
 *   - `node_modules/react-native-reanimated/android/proguard-rules.pro`
 *   - `node_modules/react-native-worklets/android/proguard-rules.pro`
 *     (both consumed the same way through their AAR metadata)
 *
 * If a release build crashes with `ClassNotFoundException` after this flag
 * was flipped on, see android/OBFUSCATION.md §5 for the diagnostic recipe
 * (grep the R8 mapping.txt, add a targeted -keep, re-run). Do NOT solve it
 * by flipping this flag back to false without escalating.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rkskmp"
    defaultConfig {
        applicationId "com.rkskmp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.0.13"

        // F-08: inject Google Maps API key at build time so it never lives
        // in source control. Developers set GOOGLE_MAPS_API_KEY in
        // ~/.gradle/gradle.properties; CI supplies ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY.
        // If neither is present, we substitute a syntactically valid but
        // deliberately non-functional placeholder so debug builds still
        // assemble cleanly on a fresh checkout (Maps tiles simply won't
        // render until the real key is supplied). See android/SECRETS.md.
        def googleMapsApiKey = project.findProperty('GOOGLE_MAPS_API_KEY') ?: 'MISSING_GOOGLE_MAPS_API_KEY'
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]
    }
    // -------------------------------------------------------------------------
    // ABI splitting policy
    //
    // Two distribution formats need different treatment:
    //
    //   1. `./gradlew assembleRelease`  → per-ABI APKs
    //      splits.abi.enable=true builds one APK per listed ABI. This is
    //      the right path for sideloading, internal distribution, or
    //      testing on a specific device.
    //
    //   2. `./gradlew bundleRelease`    → Android App Bundle (.aab)
    //      An AAB is intrinsically multi-ABI: Play Console reads its
    //      per-ABI targeting metadata and delivers a device-specific
    //      APK (containing only that device's ABI slice) at install
    //      time via Dynamic Delivery. `splits.abi` on top of an AAB
    //      is redundant, and since AGP 8.6 is an explicit build error:
    //         "Multiple shrunk-resources files found ...
    //          Please disable building multiple APKs when building an
    //          Android app bundle."
    //         https://issuetracker.google.com/402800800
    //
    // So we detect the invocation mode at configuration time and toggle
    // `splits.abi.enable` accordingly. `gradle.startParameter.taskNames`
    // is populated before the `android { }` block is evaluated, so this
    // check is safe here (unlike `gradle.taskGraph.whenReady`, which
    // resolves too late for splits configuration to react).
    // -------------------------------------------------------------------------
    def isBundleBuild = gradle.startParameter.taskNames.any { taskName ->
        def lower = taskName.toLowerCase()
        // Matches: `bundle`, `bundleRelease`, `bundleDebug`,
        // `:app:bundleRelease`, `app:bundleRelease`, or any custom
        // variant flavour like `bundleProdRelease`.
        lower == 'bundle' ||
                lower.startsWith('bundle') ||
                lower.endsWith(':bundle') ||
                (lower.contains(':bundle') && !lower.contains('assemble'))
    }

    splits {
        abi {
            // ABI splits are only meaningful for APK output. Disabling for
            // AAB builds prevents the AGP-side "multiple shrunk-resources
            // files" error while still keeping the desired per-ABI slicing
            // (Play Console does the equivalent at install time from the
            // AAB's targeting metadata).
            enable !isBundleBuild
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false // don't include all ABIs in one fat APK
        }
    }

    // Independent of the split policy above: strip x86 / x86_64 native libs
    // from the final artifact. RKSK ships to arm-only physical devices in
    // the field; the intel slices only exist for emulator debug builds.
    // AGP includes them by default when a `.so` is present for those ABIs
    // in any depended-on AAR (react-android bundles x86 for emulator dev).
    // We keep them out of the release artifact to shrink download size.
    //
    // For AAB builds, this exclusion also applies — Play Console will still
    // deliver arm-only APKs to arm devices, but the AAB itself is smaller
    // to upload if x86 slices are omitted upstream.
    packagingOptions {
        jniLibs {
            excludes += ["lib/x86/**", "lib/x86_64/**"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release keystore properties are loaded from ~/.gradle/gradle.properties
            // (per-user, outside VCS) or from ORG_GRADLE_PROJECT_* env vars on CI.
            // See android/SIGNING.md for setup instructions.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }

            // F-07 hardening: explicitly enable modern APK Signature Schemes and
            // DISABLE v1 (JAR signing). v1 is vulnerable to the Janus attack
            // (CVE-2017-13156) which lets an attacker prepend a malicious DEX
            // to a signed APK without invalidating the v1 signature. Because
            // this project's minSdkVersion is 24 (Android 7.0) and every
            // supported device enforces v2+ verification, v1 provides zero
            // additional coverage and only widens the attack surface.
            //
            //   v2 (whole-file) → API 24+ (Android 7.0)
            //   v3 (key rotation support) → API 28+ (Android 9)
            //   v4 (incremental install, produces .apk.idsig sidecar) → API 30+
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Conditionally attach the release signingConfig. When the upload
            // keystore properties aren't present (e.g. a dev machine that only
            // builds debug, or `./gradlew clean`), we simply don't wire signing
            // in — the release APK would end up unsigned. That silent path is
            // then turned into a loud failure by the gradle.taskGraph.whenReady
            // guard below, but only when a release-signing task is actually
            // scheduled to execute. This keeps clean/debug/sync flows working.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // F-15: enable R8 minification + obfuscation on release. Debug
            // builds intentionally skip R8 so on-device debugging and Metro
            // fast-refresh work without a 30-second R8 pass on every rebuild.
            minifyEnabled enableProguardInReleaseBuilds

            // F-15: also shrink resources (drawables, layouts, strings that
            // R8 proved are unreferenced). Cheap APK size win + drops any
            // dev-only asset that leaked into `res/`. `shrinkResources` is
            // only legal when `minifyEnabled` is true; the flag above must
            // stay in sync.
            shrinkResources enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// -----------------------------------------------------------------------------
// F-15 hardening: guarantee the Hermes / Metro source map never ships in the
// packaged APK.
//
// The RN gradle plugin generates a Hermes source map at
//   android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
// which is designed to be UPLOADED to a crash-reporting service (Sentry,
// Firebase Crashlytics, Datadog, …) for on-server symbolication, and then
// discarded. If it ever gets packaged into `assets/` inside the APK, an
// attacker can trivially recover original-source-quality JavaScript from
// the shipped Hermes bytecode.
//
// The current RN 0.81 gradle plugin does not bundle the .map file by
// default, but future dependency bumps or a mis-configured `bundleConfig`
// can silently regress that. This block fails the release build fast if
// any `.map` file has snuck into the packaged assets after the merge step.
//
// Implementation note: we use `tasks.matching { ... }.configureEach { ... }`
// (a lazy, AGP-version-agnostic task-hook pattern — identical to the one
// used in the root android/build.gradle for the prefab-race workaround)
// rather than `variant.mergeAssetsProvider.configure` (which changed
// signature between AGP 7 and 8).
// -----------------------------------------------------------------------------
tasks.matching { it.name == "mergeReleaseAssets" }.configureEach { mergeTask ->
    mergeTask.doLast {
        // AGP has moved this property around; try both.
        def assetsDir = null
        try {
            assetsDir = mergeTask.outputDir.get().asFile
        } catch (Exception e1) {
            try {
                assetsDir = mergeTask.outputDir.asFile
            } catch (Exception ignored) {
                // Nothing to check; treat as pass.
                return
            }
        }
        if (assetsDir == null || !assetsDir.exists()) return

        def leakedMaps = fileTree(assetsDir) {
            include "**/*.map"
            include "**/*.hbcmap"
            include "**/*.bundle.map"
        }.files
        if (!leakedMaps.isEmpty()) {
            def names = leakedMaps.collect { it.name }.join(', ')
            throw new GradleException(
                "F-15: source map(s) [${names}] leaked into packaged " +
                "assets at ${assetsDir}. Release APKs must NOT ship " +
                "source maps — they defeat Hermes bytecode obfuscation " +
                "by mapping HBC back to readable source. Upload the " +
                ".map to your crash-reporting service instead. See " +
                "android/OBFUSCATION.md §4."
            )
        }
    }
}

// -----------------------------------------------------------------------------
// F-19 hardening: guarantee the vestigial `org.apache.http.legacy` uses-library
// declaration (injected by com.google.android.gms:play-services-maps) is
// actually gone from the final merged AndroidManifest.
//
// AndroidManifest.xml carries a `tools:node="remove"` directive that instructs
// the merger to drop the play-services-maps-injected node. But manifest-merger
// rules quietly regress in three failure modes we need to catch:
//
//   1. A future play-services-maps version could rename the attribute or wrap
//      the <uses-library> inside another element, which would make the merger's
//      identifier-based match miss the removal.
//   2. A NEW dependency (Firebase, GMS Analytics, ML Kit) could ship its own
//      <uses-library android:name="org.apache.http.legacy"> declaration; the
//      merger's `remove` node is scoped to the app's own manifest and does not
//      apply to arbitrary numbers of injected copies.
//   3. A developer diffing/porting the app manifest could delete the
//      tools:node="remove" line by accident when reformatting.
//
// This task runs after processReleaseManifest and greps the OUTPUT manifest for
// the exact string. Any hit fails the release build with a diagnostic that
// points back to android/APACHE_HTTP_LEGACY.md.
//
// We deliberately scope this to RELEASE builds. Debug builds regenerate the
// merged manifest on every incremental change; running the guard there would
// slow the inner-loop `./gradlew installDebug` cycle without any security
// upside — attackers don't ship debug APKs.
// -----------------------------------------------------------------------------
// The task names differ between AGP variants:
//   - AGP 7.x → `processReleaseManifest` (produces the merged manifest)
//   - AGP 8+  → `processReleaseMainManifest` (renamed; same role) plus
//               `processReleaseManifestForPackage` (a downstream step that
//               strips build-only attributes and writes the copy that
//               actually ships in the APK).
// We hook BOTH the merged-manifest task and the packaged-manifest task so
// we validate what leaves each step, and so a future AGP rename of the
// merged task doesn't silently disable the guard (the packaged task
// would still catch a regression).
def f19ManifestTaskNames = [
    "processReleaseManifest",
    "processReleaseMainManifest",
    "processReleaseManifestForPackage",
] as Set

tasks.matching { f19ManifestTaskNames.contains(it.name) }
    .configureEach { manifestTask ->
        manifestTask.doLast {
            // Use Gradle's declared outputs for THIS task run rather than
            // walking well-known intermediates. Walking well-known paths
            // picks up stale AndroidManifest.xml files from prior builds
            // (e.g. AGP 7.x layouts left behind after an AGP upgrade, or
            // packaged_manifests output from a previous release build that
            // predates the fix). `manifestTask.outputs.files` is the
            // canonical Gradle handle for what this specific execution
            // produced — it participates in up-to-date checking, so it is
            // always the fresh output for the current build.
            def outputs
            try {
                outputs = manifestTask.outputs.files.files
            } catch (Exception e) {
                logger.warn(
                    "[F-19] Could not read outputs of task ${manifestTask.name}: " +
                    "${e.message}. Skipping guard check for this task."
                )
                return
            }

            def manifestFiles = []
            outputs.each { f ->
                if (f == null || !f.exists()) return
                if (f.isFile() && f.name == "AndroidManifest.xml") {
                    manifestFiles << f
                } else if (f.isDirectory()) {
                    manifestFiles += fileTree(f) {
                        include "**/AndroidManifest.xml"
                    }.files
                }
            }

            manifestFiles = manifestFiles.unique()
            if (manifestFiles.isEmpty()) {
                // Nothing to inspect — the task may not produce a manifest
                // file directly (some AGP variants publish through the
                // Artifacts API instead of a file output). Treat as pass
                // rather than failing the build. The other hooked task
                // covers the check.
                return
            }

            def offenders = manifestFiles.findAll { f ->
                f.text.contains('android:name="org.apache.http.legacy"')
            }
            if (!offenders.isEmpty()) {
                def paths = offenders.collect { it.absolutePath }.join('\n    ')
                throw new GradleException(
                    "F-19: the vestigial org.apache.http.legacy <uses-library> " +
                    "node is still present after ${manifestTask.name}:\n" +
                    "    ${paths}\n" +
                    "\n" +
                    "This means the `tools:node=\"remove\"` directive in " +
                    "android/app/src/main/AndroidManifest.xml is not matching " +
                    "the library-injected node — most commonly because a new " +
                    "AAR (Firebase / Play Services module / ML Kit) injects a " +
                    "second copy that our single removal rule cannot address. " +
                    "See android/APACHE_HTTP_LEGACY.md §Troubleshooting."
                )
            }
        }
    }

// -----------------------------------------------------------------------------
// F-07 hardening: reject release builds if the upload keystore isn't configured.
//
// This runs at execution time (after the task graph is resolved) rather than at
// configuration time, so it does NOT interfere with:
//     ./gradlew clean         ./gradlew tasks
//     ./gradlew assembleDebug ./gradlew installDebug
//     Android Studio Gradle sync / IDE project imports
//
// It ONLY fails the build when Gradle is about to run a release-signing task
// (assembleRelease, bundleRelease, packageRelease, signRelease, installRelease,
// or the validateSigningRelease preflight) without the required credentials.
// -----------------------------------------------------------------------------
gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskPrefixes = [
        'assemble', 'bundle', 'package', 'install', 'sign', 'validateSigning',
    ]
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        def n = task.name
        return n.endsWith('Release') && releaseTaskPrefixes.any { p -> n.startsWith(p) }
    }
    if (!isReleaseBuild) {
        return
    }

    // F-07: release must have a real upload keystore configured.
    if (!project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
        throw new GradleException(
            'Release keystore not configured. Set MYAPP_UPLOAD_STORE_FILE, ' +
            'MYAPP_UPLOAD_KEY_ALIAS, MYAPP_UPLOAD_STORE_PASSWORD and ' +
            'MYAPP_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties ' +
            '(or as ORG_GRADLE_PROJECT_* environment variables on CI). ' +
            'See android/SIGNING.md for setup instructions.'
        )
    }

    // F-08: release must have a real Google Maps API key. The debug-time
    // fallback in defaultConfig is deliberately non-functional so that
    // shipping it would result in a broken map — better to fail the build.
    if (!project.hasProperty('GOOGLE_MAPS_API_KEY')) {
        throw new GradleException(
            'Google Maps API key not configured for a release build. Set ' +
            'GOOGLE_MAPS_API_KEY in ~/.gradle/gradle.properties (or as ' +
            'ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY on CI). See ' +
            'android/SECRETS.md for how to create a properly restricted ' +
            'Android key in the Google Cloud Console.'
        )
    }

    // -------------------------------------------------------------------------
    // F-22: verify the D2D / cloud-backup opt-out is still wired up.
    //
    // Two source-tree assertions run at release-build time:
    //   1. AndroidManifest.xml declares android:dataExtractionRules pointing
    //      at our XML resource AND still has android:allowBackup="false".
    //      Both are required — the former handles API 31+, the latter handles
    //      API 24-30 and also acts as belt-and-braces on newer APIs.
    //   2. The referenced XML resource still contains BOTH <cloud-backup>
    //      and <device-transfer> blocks, and each still excludes the
    //      "root" and "external" domains. A regression could be introduced
    //      by e.g. a careless refactor that flips <exclude> to <include>,
    //      deletes the <device-transfer> block, or trims one of the
    //      required domain names.
    //
    // Both checks are string-level scans of the SOURCE files, not the merged
    // outputs, because these attributes cannot be injected by a dependency —
    // they must come from the app module itself. String-level is fragile in
    // theory (someone could reformat with a lot of whitespace to defeat the
    // match), but the release-build hook here is a defensive backstop, not
    // the primary defense. The primary defense is the file living in git
    // with the F-22 header comment.
    //
    // Both checks throw GradleException with a diagnostic that points at
    // android/DATA_EXTRACTION.md so the fix path is one click away.
    // -------------------------------------------------------------------------
    def manifestFile = file('src/main/AndroidManifest.xml')
    if (!manifestFile.exists()) {
        throw new GradleException(
            'F-22: expected AndroidManifest.xml at ' + manifestFile +
            ' but it does not exist. Something is very wrong with the module layout.'
        )
    }
    def manifestText = manifestFile.text
    if (!manifestText.contains('android:dataExtractionRules="@xml/data_extraction_rules"')) {
        throw new GradleException(
            'F-22: android:dataExtractionRules="@xml/data_extraction_rules" ' +
            'is missing from ' + manifestFile + '. Without it, Android 12+ ' +
            'setup-wizard "Copy from old phone" (D2D transfer) will still ' +
            'copy all app-private storage to the target device, bypassing ' +
            'the allowBackup="false" opt-out. See android/DATA_EXTRACTION.md.'
        )
    }
    if (!manifestText.contains('android:allowBackup="false"')) {
        throw new GradleException(
            'F-22: android:allowBackup="false" is missing from ' + manifestFile +
            '. That attribute is still required for API 24-30 devices where ' +
            'android:dataExtractionRules is silently ignored. See ' +
            'android/DATA_EXTRACTION.md.'
        )
    }

    def rulesFile = file('src/main/res/xml/data_extraction_rules.xml')
    if (!rulesFile.exists()) {
        throw new GradleException(
            'F-22: expected data-extraction rules at ' + rulesFile +
            ' but the file is missing. Restore it from git — its contents ' +
            'and the manifest attribute must stay in sync. See ' +
            'android/DATA_EXTRACTION.md.'
        )
    }
    def rulesText = rulesFile.text
    def requiredRulesPatterns = [
        // Structural: both channels must be present and each must carry
        // at least one <exclude> for the two domains we care about.
        [
            needle: '<cloud-backup',
            hint  : 'the <cloud-backup> block was removed from data_extraction_rules.xml',
        ],
        [
            needle: '<device-transfer',
            hint  : 'the <device-transfer> block was removed from data_extraction_rules.xml — this reopens the API 31+ D2D transfer path',
        ],
        [
            needle: '<exclude domain="root"',
            hint  : 'no <exclude domain="root" /> found in data_extraction_rules.xml — internal-storage private data will be copied on backup/D2D',
        ],
        [
            needle: '<exclude domain="external"',
            hint  : 'no <exclude domain="external" /> found in data_extraction_rules.xml — external app-scoped storage will be copied on backup/D2D',
        ],
    ]
    def missing = requiredRulesPatterns.findAll { entry -> !rulesText.contains(entry.needle) }
    if (!missing.isEmpty()) {
        def lines = missing.collect { entry -> '  - ' + entry.hint }.join('\n')
        throw new GradleException(
            'F-22: data_extraction_rules.xml does not carry the required ' +
            'opt-out rules:\n' + lines + '\n' +
            'Restore the excludes so that both <cloud-backup> and ' +
            '<device-transfer> deny "root" AND "external" domains. See ' +
            'android/DATA_EXTRACTION.md §3 for the canonical content.'
        )
    }

    // Sanity: refuse to ship if someone flipped an <exclude> to <include>
    // for the two domains we care about. <include> selectively OPTS IN
    // to backup for a subset of files, which is the opposite of what F-22
    // intends. We do the check as a substring on the CURRENT file text so
    // an accidental edit is caught before the build proceeds.
    def dangerousIncludes = [
        '<include domain="root"',
        '<include domain="external"',
        '<include domain="device_root"',
    ]
    def foundDangerous = dangerousIncludes.findAll { pattern -> rulesText.contains(pattern) }
    if (!foundDangerous.isEmpty()) {
        throw new GradleException(
            'F-22: data_extraction_rules.xml contains <include> rule(s) for ' +
            "domain(s) ${foundDangerous.join(', ')}. F-22 opted out of both " +
            'backup channels entirely; any <include> rule reopens data flow ' +
            'to the cloud or a target device during D2D restore. If you ' +
            'genuinely need to opt part of the app back in, extend ' +
            'android/DATA_EXTRACTION.md with the threat-model rationale ' +
            'before removing this guard.'
        )
    }
}

// -----------------------------------------------------------------------------
// F-18 hardening — belt-and-braces exclusion of LAME 3.100 + JLayer 1.0.1.
//
// react-native-compressor 1.13.0 pulls in two problematic transitive deps
// (`com.github.banketree:AndroidLame-kotlin:v0.0.1`, which wraps LAME 3.100,
// and `javazoom:jlayer:1.0.1`, a 2008-vintage MP3 decoder). RKSK never
// invokes audio compression, so both are dead weight AND known-CVE attack
// surface.
//
// The primary defense is `patches/react-native-compressor+1.13.0.patch`,
// which rewrites the compressor's own `build.gradle` and Kotlin sources to
// drop the deps. This block is a defense-in-depth backup: even if
// patch-package is skipped, the patch fails to apply cleanly after a
// `react-native-compressor` bump, or someone hand-edits the compressor
// build.gradle, Gradle will still refuse to resolve these coordinates
// project-wide. See android/AUDIO_STRIP.md.
// -----------------------------------------------------------------------------
configurations.all {
    exclude group: 'com.github.banketree', module: 'AndroidLame-kotlin'
    exclude group: 'javazoom',             module: 'jlayer'
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

