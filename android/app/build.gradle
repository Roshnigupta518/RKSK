apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * F-15 hardening: Enable R8 (successor of ProGuard) on release builds.
 *
 * With this flag ON, AGP runs R8 across the compiled Java/Kotlin classes to:
 *   1. Shrink   — dead-code elimination (removes classes/methods JS never calls)
 *   2. Optimise — inlines short methods, replaces enums with ints, etc.
 *   3. Obfuscate — renames every non-kept class/method/field to a→b→c…
 *
 * The obfuscation half is the F-15 fix on the native side: without it, a
 * `classes.dex` extraction from the APK reveals `com.rksk.SecureToken`,
 * `JailMonkeyModule.isJailBroken`, and every autolinked NativeModule's
 * `@ReactMethod` name in plain text. R8 renames all of them to opaque
 * two-letter symbols while keeping the ones ProGuard rules whitelist.
 *
 * Which rules keep the app from crashing under R8 lives in
 * `proguard-rules.pro` (this project) plus:
 *   - `node_modules/react-native/ReactAndroid/proguard-rules.pro`
 *     (auto-included via the AGP consumer-rules mechanism when the app
 *      depends on `com.facebook.react:react-android`)
 *   - `node_modules/react-native-reanimated/android/proguard-rules.pro`
 *   - `node_modules/react-native-worklets/android/proguard-rules.pro`
 *     (both consumed the same way through their AAR metadata)
 *
 * If a release build crashes with `ClassNotFoundException` after this flag
 * was flipped on, see android/OBFUSCATION.md §5 for the diagnostic recipe
 * (grep the R8 mapping.txt, add a targeted -keep, re-run). Do NOT solve it
 * by flipping this flag back to false without escalating.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rkskmp"
    defaultConfig {
        applicationId "com.rkskmp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "1.0.16"

        // F-08: inject Google Maps API key at build time so it never lives
        // in source control. Developers set GOOGLE_MAPS_API_KEY in
        // ~/.gradle/gradle.properties; CI supplies ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY.
        // If neither is present, we substitute a syntactically valid but
        // deliberately non-functional placeholder so debug builds still
        // assemble cleanly on a fresh checkout (Maps tiles simply won't
        // render until the real key is supplied). See android/SECRETS.md.
        def googleMapsApiKey = project.findProperty('GOOGLE_MAPS_API_KEY') ?: 'MISSING_GOOGLE_MAPS_API_KEY'
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]

        // ---------------------------------------------------------------------
        // F-24 hardening: sanitize embedded absolute paths in native (.so) libs.
        //
        // Prior to this fix, `libappmodules.so` (the C++ library the app's own
        // Gradle build produces from codegen-emitted TurboModule glue) shipped
        // strings like:
        //
        //   /Users/Geeta/.gradle/caches/8.14.3/transforms/6ab28e5d...
        //       /transformed/react-android-0.81.4-release/prefab/modules/
        //       reactnative/include/react/renderer/core/propsConversions.h
        //
        // in its .rodata section. Root cause: the `propsConversions.h` header
        // (part of the react-android prefab package that ships with RN) uses
        // the `__FILE__` preprocessor macro inside an inline error/log macro.
        // When our compilation of a codegen .cpp file #includes that header
        // via `-I <prefab path>`, clang expands `__FILE__` to the absolute
        // path of the header AS IT WAS FOUND. That absolute path — including
        // developer username, home directory, Gradle version, cache
        // transform hash, and RN version — then gets baked into the binary
        // as a plain-text string literal.
        //
        // AGP does strip DWARF debug sections during packaging (that's why
        // the packaged .so is ~1.4MB vs ~30MB in intermediates), but strip
        // does NOT touch .rodata. Path leaks in .rodata can only be
        // *prevented* at compile time, not removed afterward.
        //
        // Attack surface being closed:
        //   * Attribution / doxxing: an attacker with the release APK can
        //     unzip lib/arm64-v8a/*.so, run `strings`, and immediately
        //     learn the developer's OS username and home-directory layout.
        //   * Reconnaissance: the leak also exposes the exact Gradle
        //     version, React Native version, and the Gradle cache
        //     transform hash — enough to reproduce our build environment
        //     for targeted exploit work.
        //   * Play Console pre-launch review flag: multiple app-store
        //     scanners (MobSF, Ostorlab, NowSecure) flag `/Users/`,
        //     `/home/`, or hostname strings in native libraries as
        //     "sensitive data hardcoded in binaries."
        //
        // Fix: use Clang's `-ffile-prefix-map=SRC=DST` compile flag. Per
        // https://clang.llvm.org/docs/ClangCommandLineReference.html#cmdoption-clang-ffile-prefix-map
        // this remaps every path Clang emits — `__FILE__` expansions,
        // `__builtin_FILE()` calls, DWARF DW_AT_comp_dir, DW_AT_decl_file,
        // and assertion strings — from SRC to DST. It supersedes and
        // implies both `-fdebug-prefix-map` and `-fmacro-prefix-map`.
        //
        // *** ORDERING (CRITICAL) ***
        // Per Clang docs: "When multiple -ffile-prefix-map options are
        // given, later ones take precedence." So when a path could
        // match more than one rule, the LAST-declared matching rule
        // wins. We therefore declare from BROADEST to NARROWEST:
        //
        //   1. FIRST: System.getProperty("user.home")  →  /build-home
        //        Catch-all for any path under the developer's home
        //        directory that isn't covered by a narrower rule
        //        below — the NDK toolchain (`~/Library/Android/sdk/
        //        ndk/…` on macOS), Yarn global cache, npm _prebuilt
        //        cache, and so on. Destination is `/build-home` (NOT
        //        `/home` — the leading `/home/` substring would
        //        itself trip the F-24 release-build guard, producing
        //        a false-positive rewrite report).
        //
        //   2. SECOND: <homeDir>/.gradle  →  /gradle-cache
        //        Covers `~/.gradle/caches/**` — the prefab-transform
        //        directory that caused the original propsConversions.h
        //        leak. Wins over rule 1 for anything under `.gradle`.
        //
        //   3. THIRD (last): rootProject.projectDir  →  /rksk
        //        Covers `node_modules/**`, `android/**`, and app-
        //        specific source paths. Wins over rules 1 and 2 for
        //        any project-tree path. Because our repo is checked
        //        out under `<homeDir>/Desktop/NHM/rksk`, without this
        //        rule EVERY project file would get rewritten to
        //        `/build-home/Desktop/NHM/rksk/…`, which is
        //        technically leak-free but loses the readable
        //        `/rksk/…` prefix that makes crash-stack analysis
        //        easier.
        //
        // Verified against the F-24 release-build guard output from
        // 2026-07-31: the ORIGINAL ordering (rksk / gradle-cache /
        // home) failed because clang's last-wins meant every project
        // path got rewritten to `/home/Desktop/NHM/rksk/...`, which
        // (a) leaked the project subdirectory structure past the
        // remap boundary and (b) tripped the guard on `/home/`.
        // Reordering to (home / gradle-cache / rksk) resolves both.
        //
        // These flags apply to EVERY C/C++ compilation unit AGP feeds
        // into the CMake build for this app, including autolinked RN
        // modules that don't set their own hygiene (react-native-*
        // modules generally don't). AGP appends these to CMAKE_C_FLAGS
        // / CMAKE_CXX_FLAGS after any per-module defaults, so specific
        // library CMakeLists.txt files cannot silently override them.
        //
        // We also add the equivalent to release build type (see
        // buildTypes.release below) to defeat any per-variant flag
        // override. Applying at BOTH defaultConfig and buildTypes.release
        // is belt-and-braces; either alone would work for the current
        // AGP version, but AGP flag-application order has shifted
        // twice in the 7.x → 8.x range and we want the guard to be
        // regression-proof.
        //
        // Debug builds also benefit: no path leaks in debug .so files
        // means an accidentally-shipped debug APK (via sideload,
        // internal beta channel, or an CI misconfiguration) doesn't
        // regress the fix. Debuggability isn't affected — the source
        // file names inside `/rksk/`, `/gradle-cache/`, etc. remain
        // intelligible, and IDE source-mapping still works because
        // IDE-time symbol lookup uses DWARF DW_AT_comp_dir which we
        // remap to `/rksk` (the IDE knows the actual project root
        // from its own workspace configuration).
        //
        // NDK compatibility: `-ffile-prefix-map` is Clang-only, needs
        // Clang 10+ (macro remap) and 6+ (debug remap). NDK r21+ ships
        // Clang 9+ with all three, and NDK r23+ ships Clang 12+. RKSK
        // pins NDK r27 (Clang 18), so all three flags are supported.
        //
        // See android/NATIVE_PATH_HYGIENE.md for verification recipes
        // and the release-build guard that enforces the fix.
        // ---------------------------------------------------------------------
        externalNativeBuild {
            cmake {
                def prefixMap = { src, dst -> "-ffile-prefix-map=${src}=${dst}" }
                def homeDir = System.getProperty("user.home")
                def gradleUserHome = "${homeDir}/.gradle"
                def projectRoot = rootProject.projectDir.absolutePath
                // Broadest FIRST, narrowest LAST — see ordering comment above.
                // Clang's last-wins semantics mean rule ordering is inverted
                // vs. the natural "specific-first" intuition.
                def pathHygieneFlags = [
                    prefixMap(homeDir, "/build-home"),
                    prefixMap(gradleUserHome, "/gradle-cache"),
                    prefixMap(projectRoot, "/rksk"),
                ].join(" ")

                cFlags   pathHygieneFlags
                cppFlags pathHygieneFlags
            }
        }
    }
    // -------------------------------------------------------------------------
    // ABI splitting policy
    //
    // Two distribution formats need different treatment:
    //
    //   1. `./gradlew assembleRelease`  → per-ABI APKs
    //      splits.abi.enable=true builds one APK per listed ABI. This is
    //      the right path for sideloading, internal distribution, or
    //      testing on a specific device.
    //
    //   2. `./gradlew bundleRelease`    → Android App Bundle (.aab)
    //      An AAB is intrinsically multi-ABI: Play Console reads its
    //      per-ABI targeting metadata and delivers a device-specific
    //      APK (containing only that device's ABI slice) at install
    //      time via Dynamic Delivery. `splits.abi` on top of an AAB
    //      is redundant, and since AGP 8.6 is an explicit build error:
    //         "Multiple shrunk-resources files found ...
    //          Please disable building multiple APKs when building an
    //          Android app bundle."
    //         https://issuetracker.google.com/402800800
    //
    // So we detect the invocation mode at configuration time and toggle
    // `splits.abi.enable` accordingly. `gradle.startParameter.taskNames`
    // is populated before the `android { }` block is evaluated, so this
    // check is safe here (unlike `gradle.taskGraph.whenReady`, which
    // resolves too late for splits configuration to react).
    // -------------------------------------------------------------------------
    def isBundleBuild = gradle.startParameter.taskNames.any { taskName ->
        def lower = taskName.toLowerCase()
        // Matches: `bundle`, `bundleRelease`, `bundleDebug`,
        // `:app:bundleRelease`, `app:bundleRelease`, or any custom
        // variant flavour like `bundleProdRelease`.
        lower == 'bundle' ||
                lower.startsWith('bundle') ||
                lower.endsWith(':bundle') ||
                (lower.contains(':bundle') && !lower.contains('assemble'))
    }

    splits {
        abi {
            // ABI splits are only meaningful for APK output. Disabling for
            // AAB builds prevents the AGP-side "multiple shrunk-resources
            // files" error while still keeping the desired per-ABI slicing
            // (Play Console does the equivalent at install time from the
            // AAB's targeting metadata).
            enable !isBundleBuild
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false // don't include all ABIs in one fat APK
        }
    }

    // Independent of the split policy above: strip x86 / x86_64 native libs
    // from the final artifact. RKSK ships to arm-only physical devices in
    // the field; the intel slices only exist for emulator debug builds.
    // AGP includes them by default when a `.so` is present for those ABIs
    // in any depended-on AAR (react-android bundles x86 for emulator dev).
    // We keep them out of the release artifact to shrink download size.
    //
    // For AAB builds, this exclusion also applies — Play Console will still
    // deliver arm-only APKs to arm devices, but the AAB itself is smaller
    // to upload if x86 slices are omitted upstream.
    packagingOptions {
        jniLibs {
            excludes += ["lib/x86/**", "lib/x86_64/**"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release keystore properties are loaded from ~/.gradle/gradle.properties
            // (per-user, outside VCS) or from ORG_GRADLE_PROJECT_* env vars on CI.
            // See android/SIGNING.md for setup instructions.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }

            // F-07 hardening: explicitly enable modern APK Signature Schemes and
            // DISABLE v1 (JAR signing). v1 is vulnerable to the Janus attack
            // (CVE-2017-13156) which lets an attacker prepend a malicious DEX
            // to a signed APK without invalidating the v1 signature. Because
            // this project's minSdkVersion is 24 (Android 7.0) and every
            // supported device enforces v2+ verification, v1 provides zero
            // additional coverage and only widens the attack surface.
            //
            //   v2 (whole-file) → API 24+ (Android 7.0)
            //   v3 (key rotation support) → API 28+ (Android 9)
            //   v4 (incremental install, produces .apk.idsig sidecar) → API 30+
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Conditionally attach the release signingConfig. When the upload
            // keystore properties aren't present (e.g. a dev machine that only
            // builds debug, or `./gradlew clean`), we simply don't wire signing
            // in — the release APK would end up unsigned. That silent path is
            // then turned into a loud failure by the gradle.taskGraph.whenReady
            // guard below, but only when a release-signing task is actually
            // scheduled to execute. This keeps clean/debug/sync flows working.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // F-15: enable R8 minification + obfuscation on release. Debug
            // builds intentionally skip R8 so on-device debugging and Metro
            // fast-refresh work without a 30-second R8 pass on every rebuild.
            minifyEnabled enableProguardInReleaseBuilds

            // F-15: also shrink resources (drawables, layouts, strings that
            // R8 proved are unreferenced). Cheap APK size win + drops any
            // dev-only asset that leaked into `res/`. `shrinkResources` is
            // only legal when `minifyEnabled` is true; the flag above must
            // stay in sync.
            shrinkResources enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"

            // F-24 belt-and-braces: repeat the -ffile-prefix-map flags at the
            // release-buildType level. The identical flags are already set at
            // defaultConfig scope above, but AGP's flag-application order has
            // shifted twice in the 7.x → 8.x range (see AGP release notes for
            // 7.4.0 and 8.1.0 on `externalNativeBuild` inheritance). Duplicating
            // at buildType scope ensures a future AGP behaviour change that
            // silently drops defaultConfig flags for release variants (or a
            // future RN Gradle plugin release that overrides them) does not
            // regress F-24. Clang deduplicates identical flags silently, so
            // there is zero runtime or build-time cost to the redundancy.
            //
            // Debug builds intentionally do NOT get this second application —
            // if a future change breaks path hygiene for debug, we want that
            // caught by the release-build guard (see the mergeReleaseNativeLibs
            // hook further down) rather than masked by defense-in-depth.
            externalNativeBuild {
                cmake {
                    def homeDir = System.getProperty("user.home")
                    def gradleUserHome = "${homeDir}/.gradle"
                    def projectRoot = rootProject.projectDir.absolutePath
                    // See defaultConfig block above for the ordering rationale
                    // — broadest FIRST, narrowest LAST because Clang's
                    // -ffile-prefix-map uses last-wins semantics.
                    def pathHygieneFlags = [
                        "-ffile-prefix-map=${homeDir}=/build-home",
                        "-ffile-prefix-map=${gradleUserHome}=/gradle-cache",
                        "-ffile-prefix-map=${projectRoot}=/rksk",
                    ].join(" ")

                    cFlags   pathHygieneFlags
                    cppFlags pathHygieneFlags
                }
            }
        }
    }
}

// -----------------------------------------------------------------------------
// F-15 hardening: guarantee the Hermes / Metro source map never ships in the
// packaged APK.
//
// The RN gradle plugin generates a Hermes source map at
//   android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
// which is designed to be UPLOADED to a crash-reporting service (Sentry,
// Firebase Crashlytics, Datadog, …) for on-server symbolication, and then
// discarded. If it ever gets packaged into `assets/` inside the APK, an
// attacker can trivially recover original-source-quality JavaScript from
// the shipped Hermes bytecode.
//
// The current RN 0.81 gradle plugin does not bundle the .map file by
// default, but future dependency bumps or a mis-configured `bundleConfig`
// can silently regress that. This block fails the release build fast if
// any `.map` file has snuck into the packaged assets after the merge step.
//
// Implementation note: we use `tasks.matching { ... }.configureEach { ... }`
// (a lazy, AGP-version-agnostic task-hook pattern — identical to the one
// used in the root android/build.gradle for the prefab-race workaround)
// rather than `variant.mergeAssetsProvider.configure` (which changed
// signature between AGP 7 and 8).
// -----------------------------------------------------------------------------
tasks.matching { it.name == "mergeReleaseAssets" }.configureEach { mergeTask ->
    mergeTask.doLast {
        // AGP has moved this property around; try both.
        def assetsDir = null
        try {
            assetsDir = mergeTask.outputDir.get().asFile
        } catch (Exception e1) {
            try {
                assetsDir = mergeTask.outputDir.asFile
            } catch (Exception ignored) {
                // Nothing to check; treat as pass.
                return
            }
        }
        if (assetsDir == null || !assetsDir.exists()) return

        def leakedMaps = fileTree(assetsDir) {
            include "**/*.map"
            include "**/*.hbcmap"
            include "**/*.bundle.map"
        }.files
        if (!leakedMaps.isEmpty()) {
            def names = leakedMaps.collect { it.name }.join(', ')
            throw new GradleException(
                "F-15: source map(s) [${names}] leaked into packaged " +
                "assets at ${assetsDir}. Release APKs must NOT ship " +
                "source maps — they defeat Hermes bytecode obfuscation " +
                "by mapping HBC back to readable source. Upload the " +
                ".map to your crash-reporting service instead. See " +
                "android/OBFUSCATION.md §4."
            )
        }
    }
}

// -----------------------------------------------------------------------------
// Merged-manifest strip guards — release-only.
//
// Several findings excise permissions or <uses-library> declarations that
// third-party AARs inject transitively. Each is handled in AndroidManifest.xml
// by a `tools:node="remove"` directive that instructs the manifest-merger
// to drop the library-injected sibling with the same identifier. That
// directive can silently regress in three well-known modes:
//
//   1. An upstream AAR could rename or wrap the injected node in a way that
//      makes the merger's identifier-based match miss it.
//   2. A NEW dependency (Firebase, GMS Analytics, ML Kit, etc.) could ship
//      its own copy of the same node — the app's single removal rule still
//      applies, but some merge modes preserve one copy from the highest-
//      priority manifest.
//   3. A developer could delete the `tools:node="remove"` block by accident
//      during a manifest cleanup / reformat.
//
// So we grep the OUTPUT of the merged-manifest tasks for each stripped
// identifier and fail the release build if any of them reappears.
//
// The task names differ between AGP variants:
//   - AGP 7.x → `processReleaseManifest` (produces the merged manifest)
//   - AGP 8+  → `processReleaseMainManifest` (renamed; same role) plus
//               `processReleaseManifestForPackage` (a downstream step that
//               strips build-only attributes and writes the copy that
//               actually ships in the APK).
// We hook every variant so a future AGP rename doesn't silently disable
// the guard and so we validate what leaves each step.
//
// Debug builds intentionally skip the guard — the inner-loop
// `./gradlew installDebug` cycle should stay fast, and attackers don't
// ship debug APKs.
// -----------------------------------------------------------------------------
def mergedManifestStripRegistry = [
    [
        finding : "F-19",
        needle  : 'android:name="org.apache.http.legacy"',
        subject : 'the vestigial org.apache.http.legacy <uses-library> node',
        docRef  : 'android/APACHE_HTTP_LEGACY.md',
    ],
    [
        finding : "F-23",
        needle  : 'android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION"',
        subject : 'the DOWNLOAD_WITHOUT_NOTIFICATION permission (silent-download primitive from react-native-blob-util)',
        docRef  : 'android/PERMISSIONS.md §DOWNLOAD_WITHOUT_NOTIFICATION',
    ],
    [
        finding : "F-23",
        needle  : 'android:name="android.permission.RECEIVE_BOOT_COMPLETED"',
        subject : 'the RECEIVE_BOOT_COMPLETED permission (auto-start primitive from androidx.work)',
        docRef  : 'android/PERMISSIONS.md §RECEIVE_BOOT_COMPLETED',
    ],
    [
        finding : "F-23",
        needle  : 'android:name="android.permission.USE_BIOMETRIC"',
        subject : 'the USE_BIOMETRIC permission (unused — Keychain configured without biometric access control)',
        docRef  : 'android/PERMISSIONS.md §USE_BIOMETRIC',
    ],
    [
        finding : "F-23",
        needle  : 'android:name="android.permission.USE_FINGERPRINT"',
        subject : 'the USE_FINGERPRINT permission (deprecated on API 28+, unused by RKSK Keychain policy)',
        docRef  : 'android/PERMISSIONS.md §USE_FINGERPRINT',
    ],
    [
        finding : "F-25",
        needle  : 'android:name="androidx.work.impl.diagnostics.DiagnosticsReceiver"',
        subject : 'the WorkManager DiagnosticsReceiver (DUMP-protected, exported=true, dev-only diagnostic surface)',
        docRef  : 'android/RECEIVER_HYGIENE.md §DiagnosticsReceiver',
    ],
    [
        finding : "F-25",
        needle  : 'android:name="androidx.profileinstaller.ProfileInstallReceiver"',
        subject : 'the ProfileInstaller receiver (DUMP-protected, exported=true, baseline-profile install/save surface)',
        docRef  : 'android/RECEIVER_HYGIENE.md §ProfileInstallReceiver',
    ],
]

def mergedManifestTaskNames = [
    "processReleaseManifest",
    "processReleaseMainManifest",
    "processReleaseManifestForPackage",
] as Set

tasks.matching { mergedManifestTaskNames.contains(it.name) }
    .configureEach { manifestTask ->
        manifestTask.doLast {
            // Use Gradle's declared outputs for THIS task run rather than
            // walking well-known intermediates. Walking well-known paths
            // picks up stale AndroidManifest.xml files from prior builds
            // (e.g. AGP 7.x layouts left behind after an AGP upgrade, or
            // packaged_manifests output from a previous release build that
            // predates the fix). `manifestTask.outputs.files` is the
            // canonical Gradle handle for what this specific execution
            // produced — it participates in up-to-date checking, so it is
            // always the fresh output for the current build.
            def outputs
            try {
                outputs = manifestTask.outputs.files.files
            } catch (Exception e) {
                logger.warn(
                    "[merged-manifest guard] Could not read outputs of " +
                    "task ${manifestTask.name}: ${e.message}. Skipping " +
                    "check for this task."
                )
                return
            }

            def manifestFiles = []
            outputs.each { f ->
                if (f == null || !f.exists()) return
                if (f.isFile() && f.name == "AndroidManifest.xml") {
                    manifestFiles << f
                } else if (f.isDirectory()) {
                    manifestFiles += fileTree(f) {
                        include "**/AndroidManifest.xml"
                    }.files
                }
            }

            manifestFiles = manifestFiles.unique()
            if (manifestFiles.isEmpty()) {
                // Nothing to inspect — the task may not produce a manifest
                // file directly (some AGP variants publish through the
                // Artifacts API instead of a file output). Treat as pass
                // rather than failing the build. The other hooked task
                // covers the check.
                return
            }

            // Collect ALL violations in a single pass, then fail once with
            // an aggregated diagnostic. This avoids the "fix one, hit the
            // next" churn that comes from a fail-fast loop.
            def violations = []
            mergedManifestStripRegistry.each { entry ->
                def offenders = manifestFiles.findAll { f ->
                    f.text.contains(entry.needle)
                }
                if (!offenders.isEmpty()) {
                    violations << [
                        finding : entry.finding,
                        subject : entry.subject,
                        docRef  : entry.docRef,
                        needle  : entry.needle,
                        paths   : offenders.collect { it.absolutePath },
                    ]
                }
            }
            if (violations.isEmpty()) return

            def report = new StringBuilder()
            report.append(
                "Merged-manifest strip regression detected in " +
                "${manifestTask.name}. The following stripped identifiers " +
                "are back in the final release manifest:\n\n"
            )
            violations.each { v ->
                report.append("  ${v.finding}: ${v.subject}\n")
                report.append("    needle: ${v.needle}\n")
                v.paths.each { p -> report.append("    in:     ${p}\n") }
                report.append("    fix:    see ${v.docRef}\n")
                report.append("\n")
            }
            report.append(
                "Common cause: a new AAR (Firebase / Play Services / ML Kit / " +
                "an RN module bump) injected a copy of the identifier that " +
                "our single `tools:node=\"remove\"` in AndroidManifest.xml " +
                "cannot address. Add a matching removal or update the " +
                "documentation referenced above with the new threat-model " +
                "rationale before shipping."
            )
            throw new GradleException(report.toString())
        }
    }

// -----------------------------------------------------------------------------
// F-24 hardening: reject release .so files that leak developer paths/usernames.
//
// The `-ffile-prefix-map` flags in defaultConfig + buildTypes.release above are
// the *prevention* layer — they stop absolute build-machine paths from ever
// being embedded in a .so file during compilation. This guard is the
// *detection* layer — it opens every .so file that AGP is about to package
// into the release APK/AAB and greps the raw byte stream for a curated set of
// leak indicators. Any hit fails the release build.
//
// Why we need BOTH layers:
//   * A future NDK/Clang version could remove or rename -ffile-prefix-map
//     (unlikely — the flag is standardised across GCC and Clang) and
//     silently allow paths to leak again.
//   * A prebuilt .so shipped by an RN module's AAR (react-native-video's
//     ExoPlayer JNI, react-native-vision-camera's frame processor, etc.)
//     bypasses our compile flags entirely because we don't recompile it —
//     we just copy it into `lib/*` at package time. The only way to catch
//     leaks in prebuilts is to scan the final packaged bytes.
//   * A future developer could clone the repo to a path that clang's
//     prefix-map heuristics don't fully cover (e.g. through a symlink,
//     or under a case-normalised container filesystem) and reintroduce
//     the leak without noticing.
//
// The scan is intentionally string-literal-based and non-heuristic. It looks
// for known-bad substrings that unambiguously indicate an absolute local
// path (`/Users/`, `/home/`, `/Volumes/`, `C:\Users\`) plus two runtime-
// derived tokens (the current user's OS username and $HOME) that catch the
// case where an attacker on the same CI runner as us could otherwise blend
// in. False positives are extremely unlikely because these tokens don't
// occur in legitimate native code, symbol names, RTTI, or JNI signatures.
//
// Cost: a full scan of ~20MB of .so files across 4 ABI directories takes
// under one second even on modest CI hardware. The task is wired into
// `mergeReleaseNativeLibs` (the AGP task that assembles the final .so tree
// before packaging) so it runs exactly once per release build and its
// up-to-date check works via that task's outputs.
//
// Scoped to RELEASE only. Debug builds keep paths for local stack-trace
// analysis, and the inner-loop `installDebug` cycle stays fast.
// -----------------------------------------------------------------------------
tasks.matching { it.name == "mergeReleaseNativeLibs" }
    .configureEach { mergeNativeTask ->
        mergeNativeTask.doLast {
            def outputs
            try {
                outputs = mergeNativeTask.outputs.files.files
            } catch (Exception e) {
                logger.warn(
                    "[F-24] Could not read outputs of task ${mergeNativeTask.name}: " +
                    "${e.message}. Skipping native-lib path-leak scan."
                )
                return
            }

            def soFiles = []
            outputs.each { root ->
                if (root == null || !root.exists()) return
                if (root.isFile() && root.name.endsWith(".so")) {
                    soFiles << root
                } else if (root.isDirectory()) {
                    soFiles += fileTree(root) { include "**/*.so" }.files
                }
            }
            soFiles = soFiles.unique()

            if (soFiles.isEmpty()) {
                logger.warn(
                    "[F-24] mergeReleaseNativeLibs produced no .so outputs to scan. " +
                    "This is unusual for a release build; verify the CMake config " +
                    "actually compiled the app's native modules. Skipping guard."
                )
                return
            }

            // Curated leak indicators. Order does not matter — every needle
            // is applied to every file. Runtime-derived needles use the
            // *build machine's* current environment; on CI this will pick
            // up e.g. `runner`, `/home/runner`, etc.
            def leakNeedles = [
                [needle: '/Users/',   reason: 'macOS absolute path'],
                [needle: '/home/',    reason: 'Linux absolute path'],
                [needle: '/Volumes/', reason: 'macOS external-volume path'],
                [needle: 'C:\\Users\\', reason: 'Windows absolute path'],
                [needle: System.getProperty("user.name"),
                 reason: 'current build-machine username'],
                [needle: System.getProperty("user.home"),
                 reason: 'current build-machine $HOME'],
            ].findAll { it.needle && !it.needle.isEmpty() }
             .unique { it.needle }

            // ------------------------------------------------------------------
            // Upstream-leak allowlist for KNOWN, INVESTIGATED, IRREPARABLE
            // prebuilt .so files.
            //
            // The .so files RKSK compiles locally are covered by the
            // -ffile-prefix-map flags in :app and every :react-native-* library
            // (see android/build.gradle §subprojects). But some AARs ship
            // *prebuilt* .so files inside their Gradle transform — we do not
            // recompile them and cannot inject flags. If those prebuilts leak
            // upstream author paths, our guard would fire on every build and
            // the developer would have no remediation available.
            //
            // Each allowlist entry is a triple:
            //   - filePattern    : regex matched against the .so file basename
            //   - contextNeedle  : a longer string that MUST appear within ±200
            //                      bytes of the flagged hit for the hit to be
            //                      suppressed. Choosing a specific longer
            //                      substring (e.g. a full CI runner path)
            //                      makes the suppression narrow — a novel
            //                      leak in the same file that lacks this
            //                      context is still fatal.
            //   - reason         : documented rationale for the suppression.
            //
            // Adding to this allowlist is a DELIBERATE ACT — every entry
            // documents an unfixable leak and its threat-model justification
            // (see android/NATIVE_PATH_HYGIENE.md §4.2 for the upstream-fix
            // preference order). The default is fail-closed.
            def upstreamLeakAllowlist = [
                [
                    filePattern  : ~/libfbjni\.so$/,
                    contextNeedle: '/home/runner/work/fbjni/',
                    reason       : 'Facebook fbjni prebuilt (GitHub Actions ' +
                                   'CI runner path). fbjni ships inside ' +
                                   'com.facebook.fbjni:fbjni-* as a prebuilt ' +
                                   'AAR. Since RN 0.71+ fbjni is pulled in as ' +
                                   'a Gradle dependency of react-android; we ' +
                                   'do not recompile it. The leaked path is ' +
                                   'public (fbjni is OSS on GitHub Actions), ' +
                                   'non-identifying to RKSK, and unfixable ' +
                                   'without vendoring fbjni.',
                ],
            ]

            def violations = []
            soFiles.each { soFile ->
                byte[] bytes = null
                try {
                    bytes = soFile.bytes
                } catch (Exception e) {
                    logger.warn(
                        "[F-24] Could not read ${soFile.absolutePath}: ${e.message}. " +
                        "Skipping this .so for the scan."
                    )
                    return
                }
                // Decode as ISO-8859-1 (Latin-1) so every byte 0x00-0xFF
                // maps to a distinct char, preserving the file's raw byte
                // sequence for substring search. UTF-8 decoding would
                // corrupt any high-bit binary content and could produce
                // false negatives on paths encoded across byte boundaries.
                def haystack = new String(bytes, "ISO-8859-1")
                leakNeedles.each { entry ->
                    if (haystack.contains(entry.needle)) {
                        // Extract a short excerpt around the first hit for
                        // diagnostic clarity. Guard the substring range so
                        // near-start / near-end hits don't throw.
                        def idx = haystack.indexOf(entry.needle)
                        def start = Math.max(0, idx - 20)
                        def end = Math.min(haystack.length(),
                                           idx + entry.needle.length() + 60)
                        // Sanitise: keep only printable ASCII in the excerpt
                        // so shell terminals don't render binary noise.
                        def excerpt = haystack.substring(start, end)
                            .replaceAll(/[^\x20-\x7E]/, '·')

                        // Check upstream allowlist: if THIS file matches an
                        // allowlist entry AND the context around the hit
                        // (±200 bytes) contains the entry's contextNeedle,
                        // suppress the hit. We use a wider window than the
                        // display excerpt above because the leaked string
                        // (e.g. a full CI runner path) may extend well past
                        // the 60-byte display window.
                        def suppressed = upstreamLeakAllowlist.any { al ->
                            if (!al.filePattern.matcher(soFile.name).find()) {
                                return false
                            }
                            def ctxStart = Math.max(0, idx - 200)
                            def ctxEnd = Math.min(haystack.length(),
                                                  idx + entry.needle.length() + 200)
                            def ctx = haystack.substring(ctxStart, ctxEnd)
                            return ctx.contains(al.contextNeedle)
                        }
                        if (suppressed) {
                            logger.info(
                                "[F-24] suppressing known upstream leak in " +
                                "${soFile.name} (needle '${entry.needle}'; " +
                                "see android/NATIVE_PATH_HYGIENE.md §4.2)."
                            )
                            return
                        }

                        violations << [
                            file:    soFile.absolutePath,
                            needle:  entry.needle,
                            reason:  entry.reason,
                            excerpt: excerpt,
                        ]
                    }
                }
            }

            if (violations.isEmpty()) return

            def report = new StringBuilder()
            report.append(
                "F-24: native library path-leak detected in " +
                "${mergeNativeTask.name} output. The following .so files " +
                "contain absolute build-machine paths that would ship in " +
                "the release APK:\n\n"
            )
            violations.each { v ->
                def relFile = v.file.replace(rootProject.projectDir.absolutePath, ".")
                report.append("  file:    ${relFile}\n")
                report.append("  needle:  \"${v.needle}\" (${v.reason})\n")
                report.append("  excerpt: ...${v.excerpt}...\n")
                report.append("\n")
            }
            report.append(
                "Common causes and fixes:\n" +
                "  * A new RN module or upstream AAR ships a prebuilt .so\n" +
                "    that leaks its author's build paths. Report upstream\n" +
                "    and consider vendoring a patched version.\n" +
                "  * A native module the app builds locally is missing\n" +
                "    -ffile-prefix-map coverage. Verify the flags in\n" +
                "    android/app/build.gradle §defaultConfig.externalNativeBuild\n" +
                "    reach the offending compilation unit; if not, extend\n" +
                "    the prefix-map set to cover the leaked path's prefix.\n" +
                "  * The developer's home directory is on an unusual mount\n" +
                "    that the prefix-map does not resolve to the same string\n" +
                "    the compiler sees (e.g. a macOS Firmlink or Linux bind\n" +
                "    mount). Verify System.getProperty(\"user.home\") returns\n" +
                "    the same path clang embeds; realpath both if needed.\n" +
                "\n" +
                "See android/NATIVE_PATH_HYGIENE.md for full remediation."
            )
            throw new GradleException(report.toString())
        }
    }

// -----------------------------------------------------------------------------
// F-07 hardening: reject release builds if the upload keystore isn't configured.
//
// This runs at execution time (after the task graph is resolved) rather than at
// configuration time, so it does NOT interfere with:
//     ./gradlew clean         ./gradlew tasks
//     ./gradlew assembleDebug ./gradlew installDebug
//     Android Studio Gradle sync / IDE project imports
//
// It ONLY fails the build when Gradle is about to run a release-signing task
// (assembleRelease, bundleRelease, packageRelease, signRelease, installRelease,
// or the validateSigningRelease preflight) without the required credentials.
// -----------------------------------------------------------------------------
gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskPrefixes = [
        'assemble', 'bundle', 'package', 'install', 'sign', 'validateSigning',
    ]
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        def n = task.name
        return n.endsWith('Release') && releaseTaskPrefixes.any { p -> n.startsWith(p) }
    }
    if (!isReleaseBuild) {
        return
    }

    // F-07: release must have a real upload keystore configured.
    if (!project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
        throw new GradleException(
            'Release keystore not configured. Set MYAPP_UPLOAD_STORE_FILE, ' +
            'MYAPP_UPLOAD_KEY_ALIAS, MYAPP_UPLOAD_STORE_PASSWORD and ' +
            'MYAPP_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties ' +
            '(or as ORG_GRADLE_PROJECT_* environment variables on CI). ' +
            'See android/SIGNING.md for setup instructions.'
        )
    }

    // F-08: release must have a real Google Maps API key. The debug-time
    // fallback in defaultConfig is deliberately non-functional so that
    // shipping it would result in a broken map — better to fail the build.
    if (!project.hasProperty('GOOGLE_MAPS_API_KEY')) {
        throw new GradleException(
            'Google Maps API key not configured for a release build. Set ' +
            'GOOGLE_MAPS_API_KEY in ~/.gradle/gradle.properties (or as ' +
            'ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY on CI). See ' +
            'android/SECRETS.md for how to create a properly restricted ' +
            'Android key in the Google Cloud Console.'
        )
    }

    // -------------------------------------------------------------------------
    // F-22: verify the D2D / cloud-backup opt-out is still wired up.
    //
    // Two source-tree assertions run at release-build time:
    //   1. AndroidManifest.xml declares android:dataExtractionRules pointing
    //      at our XML resource AND still has android:allowBackup="false".
    //      Both are required — the former handles API 31+, the latter handles
    //      API 24-30 and also acts as belt-and-braces on newer APIs.
    //   2. The referenced XML resource still contains BOTH <cloud-backup>
    //      and <device-transfer> blocks, and each still excludes the
    //      "root" and "external" domains. A regression could be introduced
    //      by e.g. a careless refactor that flips <exclude> to <include>,
    //      deletes the <device-transfer> block, or trims one of the
    //      required domain names.
    //
    // Both checks are string-level scans of the SOURCE files, not the merged
    // outputs, because these attributes cannot be injected by a dependency —
    // they must come from the app module itself. String-level is fragile in
    // theory (someone could reformat with a lot of whitespace to defeat the
    // match), but the release-build hook here is a defensive backstop, not
    // the primary defense. The primary defense is the file living in git
    // with the F-22 header comment.
    //
    // Both checks throw GradleException with a diagnostic that points at
    // android/DATA_EXTRACTION.md so the fix path is one click away.
    // -------------------------------------------------------------------------
    def manifestFile = file('src/main/AndroidManifest.xml')
    if (!manifestFile.exists()) {
        throw new GradleException(
            'F-22: expected AndroidManifest.xml at ' + manifestFile +
            ' but it does not exist. Something is very wrong with the module layout.'
        )
    }
    def manifestText = manifestFile.text
    if (!manifestText.contains('android:dataExtractionRules="@xml/data_extraction_rules"')) {
        throw new GradleException(
            'F-22: android:dataExtractionRules="@xml/data_extraction_rules" ' +
            'is missing from ' + manifestFile + '. Without it, Android 12+ ' +
            'setup-wizard "Copy from old phone" (D2D transfer) will still ' +
            'copy all app-private storage to the target device, bypassing ' +
            'the allowBackup="false" opt-out. See android/DATA_EXTRACTION.md.'
        )
    }
    if (!manifestText.contains('android:allowBackup="false"')) {
        throw new GradleException(
            'F-22: android:allowBackup="false" is missing from ' + manifestFile +
            '. That attribute is still required for API 24-30 devices where ' +
            'android:dataExtractionRules is silently ignored. See ' +
            'android/DATA_EXTRACTION.md.'
        )
    }

    def rulesFile = file('src/main/res/xml/data_extraction_rules.xml')
    if (!rulesFile.exists()) {
        throw new GradleException(
            'F-22: expected data-extraction rules at ' + rulesFile +
            ' but the file is missing. Restore it from git — its contents ' +
            'and the manifest attribute must stay in sync. See ' +
            'android/DATA_EXTRACTION.md.'
        )
    }
    def rulesText = rulesFile.text
    def requiredRulesPatterns = [
        // Structural: both channels must be present and each must carry
        // at least one <exclude> for the two domains we care about.
        [
            needle: '<cloud-backup',
            hint  : 'the <cloud-backup> block was removed from data_extraction_rules.xml',
        ],
        [
            needle: '<device-transfer',
            hint  : 'the <device-transfer> block was removed from data_extraction_rules.xml — this reopens the API 31+ D2D transfer path',
        ],
        [
            needle: '<exclude domain="root"',
            hint  : 'no <exclude domain="root" /> found in data_extraction_rules.xml — internal-storage private data will be copied on backup/D2D',
        ],
        [
            needle: '<exclude domain="external"',
            hint  : 'no <exclude domain="external" /> found in data_extraction_rules.xml — external app-scoped storage will be copied on backup/D2D',
        ],
    ]
    def missing = requiredRulesPatterns.findAll { entry -> !rulesText.contains(entry.needle) }
    if (!missing.isEmpty()) {
        def lines = missing.collect { entry -> '  - ' + entry.hint }.join('\n')
        throw new GradleException(
            'F-22: data_extraction_rules.xml does not carry the required ' +
            'opt-out rules:\n' + lines + '\n' +
            'Restore the excludes so that both <cloud-backup> and ' +
            '<device-transfer> deny "root" AND "external" domains. See ' +
            'android/DATA_EXTRACTION.md §3 for the canonical content.'
        )
    }

    // Sanity: refuse to ship if someone flipped an <exclude> to <include>
    // for the two domains we care about. <include> selectively OPTS IN
    // to backup for a subset of files, which is the opposite of what F-22
    // intends. We do the check as a substring on the CURRENT file text so
    // an accidental edit is caught before the build proceeds.
    def dangerousIncludes = [
        '<include domain="root"',
        '<include domain="external"',
        '<include domain="device_root"',
    ]
    def foundDangerous = dangerousIncludes.findAll { pattern -> rulesText.contains(pattern) }
    if (!foundDangerous.isEmpty()) {
        throw new GradleException(
            'F-22: data_extraction_rules.xml contains <include> rule(s) for ' +
            "domain(s) ${foundDangerous.join(', ')}. F-22 opted out of both " +
            'backup channels entirely; any <include> rule reopens data flow ' +
            'to the cloud or a target device during D2D restore. If you ' +
            'genuinely need to opt part of the app back in, extend ' +
            'android/DATA_EXTRACTION.md with the threat-model rationale ' +
            'before removing this guard.'
        )
    }
}

// -----------------------------------------------------------------------------
// F-18 hardening — belt-and-braces exclusion of LAME 3.100 + JLayer 1.0.1.
//
// react-native-compressor 1.13.0 pulls in two problematic transitive deps
// (`com.github.banketree:AndroidLame-kotlin:v0.0.1`, which wraps LAME 3.100,
// and `javazoom:jlayer:1.0.1`, a 2008-vintage MP3 decoder). RKSK never
// invokes audio compression, so both are dead weight AND known-CVE attack
// surface.
//
// The primary defense is `patches/react-native-compressor+1.13.0.patch`,
// which rewrites the compressor's own `build.gradle` and Kotlin sources to
// drop the deps. This block is a defense-in-depth backup: even if
// patch-package is skipped, the patch fails to apply cleanly after a
// `react-native-compressor` bump, or someone hand-edits the compressor
// build.gradle, Gradle will still refuse to resolve these coordinates
// project-wide. See android/AUDIO_STRIP.md.
// -----------------------------------------------------------------------------
configurations.all {
    exclude group: 'com.github.banketree', module: 'AndroidLame-kotlin'
    exclude group: 'javazoom',             module: 'jlayer'
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

