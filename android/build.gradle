buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // F-10 supply-chain: needed to resolve the CycloneDX plugin marker
        // artifact `org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin`, which
        // lives on Gradle's plugin portal (its underlying jar is on Maven
        // Central, but the marker resolves via the portal).
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // F-10 supply-chain: CycloneDX Gradle plugin emits a machine-readable
        // SBOM (CycloneDX 1.6 JSON + XML) of every Maven coordinate the
        // release variant assembles. See android/SUPPLY_CHAIN.md.
        classpath("org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin:3.3.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// -----------------------------------------------------------------------------
// F-10: CycloneDX SBOM generation (org.cyclonedx.bom v3.x API).
//
// Applied at the root project so the aggregate `cyclonedxBom` task walks
// :app plus every autolinked React Native native module (:react-native-*)
// as one composed SBOM. The per-project `cyclonedxDirectBom` task is
// filtered to the release runtime classpath so debug-only and test-only
// coordinates don't pollute the shipped-artifact bill of materials.
//
// The SBOM covers the Maven / AAR layer only — it does NOT introspect the
// third-party C/C++ libraries statically linked inside libpdfium.so
// (FreeType, OpenJPEG, libpng, libjpeg-turbo, zlib). For those, follow the
// manual inspection commands in android/SUPPLY_CHAIN.md.
//
// Tasks:
//   ./gradlew :cyclonedxBom          # aggregate SBOM in build/reports/cyclonedx/
//   ./gradlew :app:cyclonedxDirectBom  # single-module SBOM
// -----------------------------------------------------------------------------
apply plugin: "org.cyclonedx.bom"

// Configure `cyclonedxDirectBom` on every project (root + subprojects). We use
// `tasks.matching { … }.configureEach { … }` — Gradle's fully lazy task
// configuration API — so we do NOT need `afterEvaluate`. Using `afterEvaluate`
// here would explode with "Cannot run Project.afterEvaluate(Closure) when the
// project is already evaluated" for RN autolinked native modules that the
// `com.facebook.react.rootproject` plugin has already finished evaluating by
// the time our block runs.
allprojects {
    tasks.matching { it.name == 'cyclonedxDirectBom' }.configureEach { task ->
        // Only inventory what actually ships in a release APK. Debug + test
        // classpaths would balloon the SBOM with dev-only coordinates.
        // Subprojects that don't expose `releaseRuntimeClasspath` (e.g. the
        // root project itself) will simply produce an empty per-project SBOM
        // — the aggregate at root pulls together the meaningful ones.
        task.includeConfigs = ["releaseRuntimeClasspath"]
        task.skipConfigs = [
            ".*[Dd]ebug.*",
            ".*[Tt]est.*",
            ".*[Aa]ndroid[Tt]est.*",
        ]
        task.projectType = "application"

        // Fills in <group>, <name>, <version>, <hashes>, <licenses> for every
        // component so downstream SCA tools (grype / trivy) have full metadata.
        task.includeMetadataResolution = true
        task.includeBomSerialNumber = true
    }
}

tasks.matching { it.name == "cyclonedxBom" }.configureEach { task ->
    task.projectType = "application"
    task.componentName = "com.rkskmp"
    task.componentVersion = "1.0.13"
    task.includeBomSerialNumber = true
}

// -----------------------------------------------------------------------------
// Cross-module `configureCMake<CmakeBuildType>[<abi>]` → `prefab<AndroidVariant>Package`
// build ordering fix (AGP prefab race condition).
//
// AGP schedules native tasks in this order:
//
//     configureCMake<CmakeBuildType>[<abi>]  ← READS prefab_package dirs
//         (produces build.ninja etc.)
//     externalNativeBuild<AndroidVariant>     ← WRITES the .so files
//         (invokes ninja on the generated build system)
//     prefab<AndroidVariant>Package           ← WRITES prefab_package/
//         (bundles headers + .so into a prefab layout)
//
// IMPORTANT — two distinct naming schemes are in play here:
//
//   * `prefab<AndroidVariant>Package` uses the ANDROID BUILD VARIANT name
//     (`Debug`, `Release`) — matching what appears in `buildTypes { … }`.
//
//   * `configureCMake<CmakeBuildType>[abi]` uses the CMAKE BUILD TYPE
//     (`Debug`, `RelWithDebInfo`, `Release`, `MinSizeRel`) — a separate
//     enum from the Android variant. AGP maps Android variants to CMake
//     build types with this default: `debug` → `Debug`, `release` →
//     `RelWithDebInfo`. Projects that pass `cmake { arguments
//     "-DCMAKE_BUILD_TYPE=Release" }` see `Release`; almost nobody
//     overrides to `MinSizeRel`.
//
//   Missing this distinction was the whole reason the release build was
//   still failing after we thought we'd fixed it. `startsWith("configureCMakeRelease")`
//   never matched `configureCMakeRelWithDebInfo[arm64-v8a]`, so the wiring
//   silently no-op'd for release-variant CMake tasks.
//
// react-native-reanimated 4.x AND :app both consume the prefab_package
// directory of every prefab-producing subproject (currently worklets and
// reanimated) as an INPUT to their configureCMake step. But the only
// cross-project dep the RN gradle plugin sets up today is
//
//     reanimated:externalNativeBuild<V> ← worklets:externalNativeBuild<V>
//
// which is TOO LATE — by then configureCMake has already run and failed.
// After `./gradlew clean` the prefab_package/ dirs are wiped, and Gradle's
// parallel scheduler happily launches configureCMake on one worker while
// prefabPackage is still queued on another, producing:
//
//     Error: invalid value for <package_path>: directory
//     ".../react-native-{reanimated,worklets}/.../prefab_package/<v>/prefab"
//     is not readable.
//
// Fix: enumerate every subproject that publishes a prefab<V>Package task
// (these are the local prefab PRODUCERS), and wire the CONSUMERS' own
// configureCMake<CmakeBuildType>* tasks to depend on all of them.
//
// Consumers we know about in this project:
//   - :app                                    consumes: reanimated + worklets
//   - :react-native-reanimated                consumes: worklets
//
// We do NOT try to make this fully generic (i.e. every subproject depends
// on every other's prefab), because reanimated:prefab<V>Package transitively
// depends on worklets:configureCMake<V>* (via reanimated's externalNativeBuild
// → worklets's externalNativeBuild → worklets's configureCMake), so
// symmetrically wiring worklets:configureCMake → reanimated:prefab would
// create a cycle. The consumption graph is directional and must be encoded
// as such.
//
// `gradle.projectsEvaluated` fires after all subprojects have been
// configured (avoids the "project already evaluated" error we hit at
// F-10 with `afterEvaluate`); `tasks.matching(...).configureEach(...)`
// keeps everything lazy so `./gradlew tasks/clean/help` still work.
// -----------------------------------------------------------------------------
gradle.projectsEvaluated {
    // Enumerate LOCAL prefab producers. Prefab artifacts pulled from the
    // Gradle transforms cache (react-android, hermes-android, fbjni) are
    // always readable — the race only affects subprojects that must
    // produce prefab_package/ from scratch each build.
    def prefabProducerNames = [
        ':react-native-reanimated',
        ':react-native-worklets',
    ]
    def producers = prefabProducerNames.collect { rootProject.findProject(it) }
                                        .findAll { it != null }

    // Consumers, in a directional map so we never cross-wire producers
    // to each other in a way that would form a cycle. Value is the list
    // of specific producer paths the consumer needs (or `null` = all).
    def consumerToProducerPaths = [
        ':app'                     : null,                                    // app needs every prefab
        ':react-native-reanimated' : [':react-native-worklets'] as Set<String>, // reanimated consumes worklets only
    ]

    // For each Android build variant, list every CMake build type that
    // AGP may pick for it. The prefab producer task is named after the
    // Android variant; the consumer configureCMake task is named after
    // the CMake build type. We match consumer task names as `startsWith`
    // so both `configureCMakeRelWithDebInfo` and
    // `configureCMakeRelWithDebInfo[arm64-v8a]` are caught.
    def cmakeBuildTypesForAndroidVariant = [
        'Debug'  : ['Debug'],
        'Release': ['RelWithDebInfo', 'Release', 'MinSizeRel'],
    ]

    cmakeBuildTypesForAndroidVariant.each { androidVariant, cmakeBuildTypes ->
        consumerToProducerPaths.each { consumerPath, allowedProducerPaths ->
            def consumer = rootProject.findProject(consumerPath)
            if (consumer == null) return

            def prefabTasksForVariant = producers.findAll { producer ->
                        producer.path != consumerPath &&
                                (allowedProducerPaths == null ||
                                        allowedProducerPaths.contains(producer.path))
                    }
                    .collect { producer -> producer.tasks.findByName("prefab${androidVariant}Package") }
                    .findAll { it != null }

            if (prefabTasksForVariant.isEmpty()) return

            consumer.tasks.matching { task ->
                        cmakeBuildTypes.any { cmakeType ->
                            task.name.startsWith("configureCMake${cmakeType}")
                        }
                    }
                    .configureEach { task ->
                        prefabTasksForVariant.each { producerTask ->
                            task.dependsOn(producerTask)
                        }
                    }
        }
    }
}

// -----------------------------------------------------------------------------
// F-24 hardening: propagate -ffile-prefix-map to EVERY Android library
// subproject's NDK build.
//
// The app-level flags in android/app/build.gradle only cover :app's own C++
// compile output (libappmodules.so). React Native autolinked native modules
// live in their OWN subprojects — :react-native-worklets, :react-native-
// screens, :react-native-gesture-handler, :react-native-reanimated, etc. —
// and each has its own AGP config + CMake invocation, so app-level cFlags
// don't reach them.
//
// The F-24 release-build guard confirmed this on 2026-07-31: 8 of the 10
// leaking .so files were library subprojects (libworklets.so, librnscreens.so,
// libgesturehandler.so, libreanimated.so — both arm64-v8a + armeabi-v7a),
// with paths like:
//
//     lambda at /Users/Geeta/Desktop/NHM/rksk/node_modules/react-native-worklets/...
//     lambda at /Users/Geeta/Library/Android/sdk/ndk/27.1.12297006/toolchains/...
//
// This block adds the SAME three -ffile-prefix-map rules used by :app to
// every Android library subproject's defaultConfig.externalNativeBuild.cmake
// so all module CMake builds get consistent path hygiene.
//
// Ordering is critical (see android/app/build.gradle for the detailed
// rationale): Clang's -ffile-prefix-map uses LAST-match-wins, so we declare
// broadest → narrowest. If reordered, project-tree paths would be swallowed
// by the broadest rule and lose their `/rksk/` prefix, or worse, produce a
// destination string that itself matches a leak needle.
//
// We use `subproject.plugins.withType(...)` (Gradle's fully lazy plugin-
// application listener) rather than `afterEvaluate { }`. This avoids the
// "Cannot run Project.afterEvaluate(Closure) when the project is already
// evaluated" trap that F-10 hit during CycloneDX integration — some RN
// autolinked modules finish evaluating before this root block runs, and
// `afterEvaluate` on an already-evaluated project throws.
//
// The DSL methods `cFlags(...)` / `cppFlags(...)` are additive — they
// APPEND to whatever the library already declared. We do NOT overwrite
// module-specific flags (e.g. -DNDEBUG, worklets' own -DHAS_ATOMIC),
// only inject our hygiene tokens.
//
// The propagation applies to ALL variants (debug + release) because
// keeping debug builds hygiene-clean is defence-in-depth against
// accidentally-shipped debug APKs (via sideload, an internal beta
// channel misconfiguration, or CI mishap). Compile-time impact is
// negligible: three additional Clang args per compilation unit.
// -----------------------------------------------------------------------------
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def homeDir = System.getProperty("user.home")
        def gradleUserHome = "${homeDir}/.gradle"
        def projectRoot = rootProject.projectDir.absolutePath
        // Broadest FIRST, narrowest LAST — Clang last-wins semantics.
        def pathHygieneFlags = [
            "-ffile-prefix-map=${homeDir}=/build-home",
            "-ffile-prefix-map=${gradleUserHome}=/gradle-cache",
            "-ffile-prefix-map=${projectRoot}=/rksk",
        ]
        subproject.android {
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        pathHygieneFlags.each { flag ->
                            cFlags flag
                            cppFlags flag
                        }
                    }
                }
            }
        }
    }
}
