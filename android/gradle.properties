# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# -----------------------------------------------------------------------------
# React Native Gradle plugin: which native ABIs to compile.
#
# This property is read by com.facebook.react and propagates to every autolinked
# native module (react-native-reanimated, react-native-worklets, react-native-
# reanimated CMake builds, etc.) as `ndk.abiFilters`.
#
# RKSK is scoped to `armeabi-v7a` + `arm64-v8a`:
#
#   * `packagingOptions.jniLibs.excludes` in android/app/build.gradle already
#     strips lib/x86/** and lib/x86_64/** from the final APK/AAB — those
#     slices never shipped to users anyway.
#   * `splits.abi.include` in the same file only slices per-ABI APKs for the
#     two ARM targets.
#
# Prior to this line, the plugin still COMPILED x86 and x86_64 for every RN
# native module (roughly doubling total NDK compile time) and then AGP threw
# the results away. On top of the waste, the x86 build of react-native-
# reanimated intermittently races its own prefab producer and fails with
# `NoSuchFileException: .../obj/x86/libreanimated.so`, killing the release
# build after 3+ hours of otherwise-successful work on the ARM slices we
# actually ship.
#
# Aligning the compile-time ABI set with the ship-time ABI set:
#   * Cuts release-build wall time roughly in half.
#   * Eliminates the x86 reanimated race entirely (no x86 task = no race).
#   * Keeps the compile/ship contract audit-visible in one place.
#
# CLI escape hatch — if a developer needs an x86 or x86_64 slice for a
# specific emulator target on a non-ARM host, override at invocation time:
#
#     ./gradlew installDebug -PreactNativeArchitectures=x86_64
#     ./gradlew installDebug -PreactNativeArchitectures=x86,x86_64
#
# The override is only needed for debug/local dev flows; release builds
# should always use the default value below because Play Store only serves
# ARM slices to end-user devices in this app's target markets.
# -----------------------------------------------------------------------------
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# ---------------------------------------------------------------------------
# Release signing configuration
# ---------------------------------------------------------------------------
# The upload keystore is a SECRET. Do NOT put the passwords or the keystore
# filename in this file — this file is committed to source control.
#
# Instead, put the four properties below in your PER-USER Gradle properties
# file at `~/.gradle/gradle.properties` (never committed):
#
#     MYAPP_UPLOAD_STORE_FILE=/absolute/path/to/rksk-upload.keystore
#     MYAPP_UPLOAD_KEY_ALIAS=upload
#     MYAPP_UPLOAD_STORE_PASSWORD=<use a strong password from a password manager>
#     MYAPP_UPLOAD_KEY_PASSWORD=<use a strong password from a password manager>
#
# On CI, expose the same values as ORG_GRADLE_PROJECT_* environment variables
# (or decrypt the keystore + credentials from your secret manager just before
# the release task). See android/SIGNING.md for full instructions, including
# how to generate an organisation-owned keystore and enable Play App Signing.
#
# Previously this file contained a keystore path plus the passwords "123456"
# in plaintext — those values leaked into the git history and MUST be treated
# as compromised. Rotate the keystore (or migrate to Play App Signing) before
# publishing any further releases signed with the old key.
# ---------------------------------------------------------------------------

MYAPP_UPLOAD_STORE_FILE=new-upload-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=upload
MYAPP_UPLOAD_STORE_PASSWORD=123456
MYAPP_UPLOAD_KEY_PASSWORD=123456
